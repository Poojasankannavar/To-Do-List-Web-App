<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="todo-card">
            <h1>My To-Do List 📝</h1>
            <p class="subtitle">Organize your day, one task at a time.</p>

            <div class="input-section">
                <input type="text" id="taskInput" placeholder="Enter your task..." maxlength="100" aria-label="New task">
                <button id="addBtn" type="button">Add Task</button>
            </div>

            <div class="stats" aria-live="polite">
                <span>Total: <strong id="totalCount">0</strong></span>
                <span>Pending: <strong id="pendingCount">0</strong></span>
                <span>Completed: <strong id="completedCount">0</strong></span>
            </div>

            <ul id="taskList" aria-label="Tasks"></ul>
            <p id="emptyMessage">No tasks yet. Add your first task!</p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
